version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-institute_db}
      POSTGRES_USER: ${POSTGRES_USER:-institute_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-institute_pass}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the root .env file}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@example.com}
      EMAIL_VERIFICATION_CODE_TTL_MINUTES: ${EMAIL_VERIFICATION_CODE_TTL_MINUTES:-10}
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      EMAIL_VERIFICATION_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}
      INSTITUTE_NAME: ${INSTITUTE_NAME:-TechSkill Institute}
      COURSE_PFS_DURATION_MONTHS: ${COURSE_PFS_DURATION_MONTHS:-5}
      COURSE_JFS_DURATION_MONTHS: ${COURSE_JFS_DURATION_MONTHS:-5}
      COURSE_DA_DURATION_MONTHS: ${COURSE_DA_DURATION_MONTHS:-4}
      COURSE_FED_DURATION_MONTHS: ${COURSE_FED_DURATION_MONTHS:-3}
      DEFAULT_CLASS_DURATION_HOURS: ${DEFAULT_CLASS_DURATION_HOURS:-2}
      WEEKDAY_CLASS_SLOTS: ${WEEKDAY_CLASS_SLOTS:-18:30-20:30,19:00-21:00}
      WEEKEND_CLASS_SLOTS: ${WEEKEND_CLASS_SLOTS:-09:00-11:00,14:00-16:00,17:00-19:00}
      CLASS_THEORY_PERCENTAGE: ${CLASS_THEORY_PERCENTAGE:-30}
      CLASS_PRACTICAL_PERCENTAGE: ${CLASS_PRACTICAL_PERCENTAGE:-70}
      POSTGRES_DB: ${POSTGRES_DB:-institute_db}
      POSTGRES_USER: ${POSTGRES_USER:-institute_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-institute_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_INSTITUTE_NAME: ${INSTITUTE_NAME:-TechSkill Institute}
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data:
